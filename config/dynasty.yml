# ---------------------------------------------------------------------------
# DYNASTY STARTUP DRAFT
#
# This is a SEPARATE DRAFT from the Champions League redraft. It shares no
# rankings, no picks, and no storage with it. Drafting a player on the Draft
# page has no effect here, and vice versa. That separation is deliberate --
# see webapp/core.js (KEY / __CL_NAMESPACE) for how it is enforced.
#
# RANKINGS: drop dynasty ranking files into  data/dynasty/  -- NOT into
# data/sources/, which feeds the redraft board. Then run:
#     python -m pipeline.build
# A new file is auto-registered below at weight 0.0; set its weight and re-run.
# ---------------------------------------------------------------------------

enabled: true

league:
  name: Dynasty Startup
  teams: 12
  rounds: 29            # matches the Sleeper draft (29 rounds, 12 teams)
  format: superflex
  scoring: half_ppr
  snake: true

# Seat 1 picks first in round 1; order reverses each round. You can edit this
# live on the page -- it remembers your edits independently of the redraft.
draft_order:
  1: "Liran & Joe"
  2: "Charlie"
  3: "Natty"
  4: "Setton & Leor"
  5: "Mikey"
  6: "Ben"
  7: "Josh"
  8: "Aaron L."
  9: "Russ"
  10: "Austin"
  11: "Rutta"
  12: "Jordy"

my_seat: 3            # Natty

# ---------------------------------------------------------------------------
# DYNASTY RANKING SOURCES
#
# Empty until you drop a file into data/dynasty/. The page works without them
# (it just has no player pool yet) and says so plainly rather than showing a
# redraft list that would be wrong for dynasty.
#
# Redraft rankings are NOT used here on purpose: they rank a 30-year-old above
# a rookie, which is backwards for dynasty.
# ---------------------------------------------------------------------------
sources:
  # Dynasty superflex / half-PPR / 12-team values from FantasyCalc's public API,
  # pulled 2026-08-28. These are DYNASTY values, not redraft: they price age in,
  # which is why Josh Allen is QB1 overall and Justin Jefferson sits outside the
  # top ten. Top 350 players; FantasyCalc's rookie-pick entries ("2026 Pick
  # 1.01") are excluded because you cannot select a pick in a startup draft.
  #
  # To refresh: drop a newer *fantasycalc* file into data/dynasty/ and rebuild.
  # The newest file matching the glob wins, so the old one needs no cleanup.
  # Sleeper's own dynasty superflex board, scraped 2026-08-28 from the draft
  # room for draft 1383259101261225984 (The Regime). This is the list you see
  # inside Sleeper. Its ranking is not available from any Sleeper API -- the
  # public and authenticated GraphQL schemas have no ADP or rank field -- so it
  # was read off the rendered draft board.
  - id: sleeper
    label: Sleeper dynasty SF
    short: Sleep
    match: "*sleeper_dynasty*"
    weight: 0.50
    scope: overall
    columns:
      player: Player
      pos: Pos
      team: Team
      rank: Rank
    polarity: rank

  # Second dynasty opinion. Where the two disagree sharply the board raises a
  # VOLATILE flag, which is the point of carrying more than one.
  - id: fantasycalc
    label: FantasyCalc dynasty SF
    short: Dyn
    match: "*fantasycalc*"
    weight: 0.50
    scope: overall
    columns:
      player: Player
      pos: Pos
      team: Team
      rank: Rank
    polarity: rank


composite:
  method: log_rank
  missing_penalty: 0.35

tiers:
  gap_z_threshold: 1.0
  min_tier_size: 2
  max_tier_size: 12
  positions: [QB, RB, WR, TE]
