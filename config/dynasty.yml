# ---------------------------------------------------------------------------
# DYNASTY STARTUP DRAFT
#
# This is a SEPARATE DRAFT from the Champions League redraft. It shares no
# rankings, no picks, and no storage with it. Drafting a player on the Draft
# page has no effect here, and vice versa. That separation is deliberate --
# see webapp/core.js (KEY / __CL_NAMESPACE) for how it is enforced.
#
# RANKINGS: drop dynasty ranking files into  data/dynasty/  -- NOT into
# data/sources/, which feeds the redraft board. Then run:
#     python -m pipeline.build
# A new file is auto-registered below at weight 0.0; set its weight and re-run.
# ---------------------------------------------------------------------------

enabled: true

league:
  name: Dynasty Startup
  teams: 12
  rounds: 29            # matches the Sleeper draft (29 rounds, 12 teams)
  format: superflex
  scoring: half_ppr
  snake: true

# Seat 1 picks first in round 1; order reverses each round. You can edit this
# live on the page -- it remembers your edits independently of the redraft.
draft_order:
  1: "Liran & Joe"
  2: "Charlie"
  3: "Natty"
  4: "Setton & Leor"
  5: "Mikey"
  6: "Ben"
  7: "Josh"
  8: "Aaron L."
  9: "Russ"
  10: "Austin"
  11: "Rutta"
  12: "Jordy"

my_seat: 3            # Natty

# ---------------------------------------------------------------------------
# DYNASTY RANKING SOURCES
#
# Empty until you drop a file into data/dynasty/. The page works without them
# (it just has no player pool yet) and says so plainly rather than showing a
# redraft list that would be wrong for dynasty.
#
# Redraft rankings are NOT used here on purpose: they rank a 30-year-old above
# a rookie, which is backwards for dynasty.
# ---------------------------------------------------------------------------
sources:
  # Dynasty superflex / half-PPR / 12-team values from FantasyCalc's public API,
  # pulled 2026-08-28. These are DYNASTY values, not redraft: they price age in,
  # which is why Josh Allen is QB1 overall and Justin Jefferson sits outside the
  # top ten. Top 350 players; FantasyCalc's rookie-pick entries ("2026 Pick
  # 1.01") are excluded because you cannot select a pick in a startup draft.
  #
  # To refresh: drop a newer *fantasycalc* file into data/dynasty/ and rebuild.
  # The newest file matching the glob wins, so the old one needs no cleanup.
  # Sleeper's own dynasty superflex board, scraped 2026-08-28 from the draft
  # room for draft 1383259101261225984 (The Regime). This is the list you see
  # inside Sleeper. Its ranking is not available from any Sleeper API -- the
  # public and authenticated GraphQL schemas have no ADP or rank field -- so it
  # was read off the rendered draft board.
  # Faraz's dynasty superflex list, 341 players. Given the lead weight because
  # he is the ranker you trust most on the redraft board too. He is distinctly
  # WR-heavy and RB/TE-light -- 23 WRs in his top 50 against 18 for the other
  # two -- so the other sources are kept on to catch his outliers rather than
  # to outvote him. Median disagreement with them is 18 ranks over 308 shared
  # players; the extremes are all past rank 150, where nobody has conviction.
  #
  # scope: overall -- his list ranks across positions, so it votes on
  # QB-vs-WR value. (Contrast Joel on the redraft board, who is positional.)
  - id: faraz
    label: Faraz dynasty SF
    short: Faraz
    match: "*faraz_dynasty*"
    weight: 0.40
    scope: overall
    columns:
      player: name
      pos: pos
      team: team
      rank: rank
    polarity: rank

  # MARKET BASELINE — weight 0, so it never moves the rankings. Split out of
  # Faraz's adp column (255 of his 341 players carry one). Its only job is to
  # give the dynasty board a market to measure against, which is what powers
  # the "vs ADP" column and the MARKET VALUE / MARKET REACH flags. The redraft
  # board has had this from Sleeper ADP all along; dynasty had nothing.
  - id: adp
    label: Dynasty ADP (market reference)
    short: ADP
    match: "*market_adp_dynasty*"
    weight: 0.00
    role: market
    scope: overall
    columns:
      player: Player
      pos: Pos
      team: Team
      rank: ADP
    polarity: rank

  # Tom's dynasty superflex list. Shorter than the others -- 199 players
  # against 341/350 -- so he simply has no opinion on the deep bench. That is
  # why his weight sits below Faraz's: with missing_penalty at 0.35, a heavy
  # weight on a short list would push everyone he omits down the board for no
  # reason other than his list ending.
  - id: tom
    label: Tom's ranking
    short: Tom
    match: "*tom_dynasty*"
    weight: 0.25
    scope: overall
    columns:
      player: Player
      pos: Position
      team: auto
      rank: Overall
      age: Age
    polarity: rank

  - id: sleeper
    label: Sleeper dynasty SF
    short: Sleep
    match: "*sleeper_dynasty*"
    # The draft is run on Sleeper, so this list is what most of the room will
    # actually have in front of them. role: platform surfaces its rank beside
    # every player on the draft page -- not as an opinion about who is good,
    # but as a prediction of who disappears next.
    role: platform
    weight: 0.20
    scope: overall
    columns:
      player: Player
      pos: Pos
      team: Team
      rank: Rank
    polarity: rank

  # Second dynasty opinion. Where the two disagree sharply the board raises a
  # VOLATILE flag, which is the point of carrying more than one.
  - id: fantasycalc
    label: FantasyCalc dynasty SF
    short: Dyn
    match: "*fantasycalc*"
    weight: 0.15
    scope: overall
    columns:
      player: Player
      pos: Pos
      team: Team
      rank: Rank
    polarity: rank


  - id: superflex
    label: superflex
    match: "superflex*"
    weight: 0.0        # <-- SET THIS, then re-run
    scope: overall
    columns:
      player: Player
      pos: Position
      team: auto
      rank: Overall
    polarity: rank

composite:
  method: log_rank
  missing_penalty: 0.35

# ---------------------------------------------------------------------------
# FLAG THRESHOLDS
# Same shape as the redraft board's. There is no league-history model here --
# this league has never drafted -- so only the market and spread flags apply.
# ---------------------------------------------------------------------------
flags:
  # Cheaper / pricier by dynasty ADP than the composite ranks him, in ranks.
  market_value: 15
  market_reach: 15
  # Weighted spread of log(rank within position) across the three rankers.
  volatile: 0.20
  # Percent of weighted sources that do not rank him at all.
  thin_coverage: 60

tiers:
  gap_z_threshold: 1.0
  min_tier_size: 2
  max_tier_size: 12
  positions: [QB, RB, WR, TE]
